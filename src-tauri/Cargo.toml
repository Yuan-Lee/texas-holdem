[package]
name = "texas-holdem"
version = "0.1.0"
description = "Texas Hold'em Poker Game"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "texas_holdem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
